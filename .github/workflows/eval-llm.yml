name: LLM evaluation

# Text-to-SQL and LLM routing need a 7B model on a CPU runner, which is too slow for
# every push. They run weekly, on demand, and on pull requests labelled `eval-llm`.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  pull_request:
    types: [labeled, synchronize]

jobs:
  llm:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'eval-llm')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      OLLAMA_MODELS: /home/runner/.ollama/models
      FOURTHDOWN_LLM_MODEL: qwen2.5-coder:7b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU torch (the default wheel drags in CUDA)
        run: pip install "torch>=2.2" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]"
      - name: Restore nflverse downloads
        uses: actions/cache@v4
        with:
          path: data/raw
          key: nflverse-pbp-2009-2024-v1
      - name: Build the warehouse
        run: fourthdown build --seasons 2009-2024
      - name: Restore Ollama models
        uses: actions/cache@v4
        with:
          path: /home/runner/.ollama/models
          key: ollama-${{ env.FOURTHDOWN_LLM_MODEL }}-v1
      - name: Install and start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama || true
          nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for _ in $(seq 60); do curl -sf http://localhost:11434/api/tags > /dev/null && break; sleep 1; done
          ollama pull "$FOURTHDOWN_LLM_MODEL"
      - name: Scorecard (LLM suites)
        run: >-
          fourthdown scorecard
          --suites guard,references,routing_keyword,routing_llm,text_to_sql
          --require routing_llm,text_to_sql
          --output eval/scorecard.md --json eval/scorecard.json
      - name: Publish the scorecard to the job summary
        if: always() && hashFiles('eval/scorecard.md') != ''
        run: cat eval/scorecard.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('eval/scorecard.json') != ''
        with:
          name: scorecard-llm
          path: eval/
      - name: Ollama log
        if: failure()
        run: tail -100 "$RUNNER_TEMP/ollama.log"
