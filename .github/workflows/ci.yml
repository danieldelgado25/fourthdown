name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      FOURTHDOWN_PG_DSN: postgresql://fourthdown:fourthdown@localhost:5432/fourthdown
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: fourthdown
          POSTGRES_PASSWORD: fourthdown
          POSTGRES_DB: fourthdown
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fourthdown"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU torch (the default wheel drags in CUDA)
        run: pip install "torch>=2.2" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -m "not slow"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test

  dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU torch (the default wheel drags in CUDA)
        run: pip install "torch>=2.2" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]"
      - name: Build one season end to end
        run: fourthdown build --seasons 2024
      - run: pytest -m slow
      - run: fourthdown audit

  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU torch (the default wheel drags in CUDA)
        run: pip install "torch>=2.2" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]"
      - name: Restore nflverse downloads
        uses: actions/cache@v4
        with:
          path: data/raw
          key: nflverse-pbp-2009-2024-v1
      - name: Build every season the models are scored on
        run: fourthdown build --seasons 2009-2024
      - name: Scorecard (offline suites, gated by src/fourthdown/evaluation/gates.json)
        run: make scorecard-ci
      - name: Verify the data against its provenance manifest
        run: fourthdown lineage --verify --output eval/lineage.md
      - name: Train a short run, tracked in MLflow, to package
        run: fourthdown train --epochs 5 --audit-sample 200 --output eval/model_eval.md
      - name: Build the win-probability image
        run: make wp-image
      - name: Smoke-test the container
        run: |
          docker run -d --name winprob -p 8080:8080 fourthdown-winprob:latest
          for _ in $(seq 30); do curl -sf localhost:8080/health && break; sleep 2; done
          curl -sf localhost:8080/v1/win-probability -H 'content-type: application/json' \
            -d '{"yardline_100": 45, "down": 2, "ydstogo": 7, "game_seconds_remaining": 900, "score_differential": 3}' \
            | tee eval/winprob_response.json
          python - <<'PY'
          import json
          body = json.load(open("eval/winprob_response.json"))
          card = json.load(open("data/models/model_card.json"))
          assert 0.0 < body["win_probability"] < 1.0, body
          assert body["model"]["data_version"] == card["data_version"], body
          assert body["model"]["mlflow_run_id"] == card["mlflow_run_id"], body
          PY
          status=$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/v1/win-probability \
            -H 'content-type: application/json' -d '{"down": 5}')
          test "$status" = 400
      - name: Container logs
        if: failure()
        run: docker logs winprob || true
      - name: Publish the scorecard to the job summary
        if: always() && hashFiles('eval/scorecard.md') != ''
        run: cat eval/scorecard.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('eval/scorecard.json') != ''
        with:
          name: scorecard
          path: eval/

  k8s:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - name: Lint the chart
        run: make helm-lint
      - name: Build the service and pipeline images
        run: make images
      - uses: helm/kind-action@v1
        with:
          cluster_name: fourthdown
          config: deploy/kind/cluster.yaml
      - name: Load the images into kind
        run: >-
          kind load docker-image --name fourthdown
          fourthdown-gateway:latest fourthdown-warehouse:latest fourthdown-retrieval:latest
          fourthdown-models:latest fourthdown-pipeline:latest
      - name: Install the chart (pipeline Job, Postgres, gateway and tool services)
        run: >-
          helm install fourthdown deploy/helm/fourthdown
          -f deploy/helm/fourthdown/values-kind.yaml -f deploy/helm/fourthdown/values-ci.yaml
          --set postgres.password=ci --wait --timeout 25m
      - name: helm test (health, advice, and routing through the gateway)
        run: helm test fourthdown --logs
      - name: Reach the dashboard through the kind port mapping
        run: |
          curl -sf localhost:8088/ | grep -q '<div id="root">'
          curl -sf localhost:8088/api/health | tee health.json
          python3 -c "import json; h = json.load(open('health.json')); assert h['warehouse'] and h['models'], h"
          curl -sf "localhost:8088/api/tendencies?season=2024" | grep -q '"rows": *\[\['
      - name: Cluster state
        if: failure()
        run: |
          kubectl get all,pvc,jobs -o wide
          kubectl describe pods
          for pod in $(kubectl get pods -o name); do kubectl logs "$pod" --all-containers --tail=100 || true; done

  # Publishes the images docker-compose.prod.yml pulls, tagged latest and with the commit,
  # once main passes everything above.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, web, eval, k8s]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [gateway, warehouse, retrieval, models, pipeline]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fourthdown-${{ matrix.target }}:latest
            ghcr.io/${{ github.repository_owner }}/fourthdown-${{ matrix.target }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
