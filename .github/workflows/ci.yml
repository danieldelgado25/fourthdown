name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: fourthdown
          POSTGRES_PASSWORD: fourthdown
          POSTGRES_DB: fourthdown
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fourthdown"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU torch (the default wheel drags in CUDA)
        run: pip install "torch>=2.2" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -m "not slow"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test

  dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU torch (the default wheel drags in CUDA)
        run: pip install "torch>=2.2" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]"
      - name: Build one season end to end
        run: fourthdown build --seasons 2024
      - run: pytest -m slow
      - run: fourthdown audit

  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU torch (the default wheel drags in CUDA)
        run: pip install "torch>=2.2" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]"
      - name: Restore nflverse downloads
        uses: actions/cache@v4
        with:
          path: data/raw
          key: nflverse-pbp-2009-2024-v1
      - name: Build every season the models are scored on
        run: fourthdown build --seasons 2009-2024
      - name: Scorecard (offline suites, gated by src/fourthdown/evaluation/gates.json)
        run: make scorecard-ci
      - name: Verify the data against its provenance manifest
        run: fourthdown lineage --verify --output eval/lineage.md
      - name: Train a short run, tracked in MLflow, to package
        run: fourthdown train --epochs 5 --audit-sample 200 --output eval/model_eval.md
      - name: Build the win-probability image
        run: make wp-image
      - name: Smoke-test the container
        run: |
          docker run -d --name winprob -p 8080:8080 fourthdown-winprob:latest
          for _ in $(seq 30); do curl -sf localhost:8080/health && break; sleep 2; done
          curl -sf localhost:8080/v1/win-probability -H 'content-type: application/json' \
            -d '{"yardline_100": 45, "down": 2, "ydstogo": 7, "game_seconds_remaining": 900, "score_differential": 3}' \
            | tee eval/winprob_response.json
          python - <<'PY'
          import json
          body = json.load(open("eval/winprob_response.json"))
          card = json.load(open("data/models/model_card.json"))
          assert 0.0 < body["win_probability"] < 1.0, body
          assert body["model"]["data_version"] == card["data_version"], body
          assert body["model"]["mlflow_run_id"] == card["mlflow_run_id"], body
          PY
          status=$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/v1/win-probability \
            -H 'content-type: application/json' -d '{"down": 5}')
          test "$status" = 400
      - name: Container logs
        if: failure()
        run: docker logs winprob || true
      - name: Publish the scorecard to the job summary
        if: always() && hashFiles('eval/scorecard.md') != ''
        run: cat eval/scorecard.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('eval/scorecard.json') != ''
        with:
          name: scorecard
          path: eval/
