name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: fourthdown
          POSTGRES_PASSWORD: fourthdown
          POSTGRES_DB: fourthdown
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fourthdown"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU torch (the default wheel drags in CUDA)
        run: pip install "torch>=2.2" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -m "not slow"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test

  dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU torch (the default wheel drags in CUDA)
        run: pip install "torch>=2.2" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]"
      - name: Build one season end to end
        run: fourthdown build --seasons 2024
      - run: pytest -m slow
      - run: fourthdown audit
