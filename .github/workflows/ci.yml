name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      FOURTHDOWN_PG_DSN: postgresql://fourthdown:fourthdown@localhost:5432/fourthdown
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: fourthdown
          POSTGRES_PASSWORD: fourthdown
          POSTGRES_DB: fourthdown
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fourthdown"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU torch (the default wheel drags in CUDA)
        run: pip install "torch>=2.2" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -m "not slow"
      # Keyword routing needs no data and no LLM, so its golden set gates every push.
      # The rest of the harness runs in eval.yml.
      - run: fourthdown eval-routing --output routing_eval.md --min-accuracy 0.9

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test

  dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU torch (the default wheel drags in CUDA)
        run: pip install "torch>=2.2" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]"
      - name: Build one season end to end
        run: fourthdown build --seasons 2024
      - run: pytest -m slow
      - run: fourthdown audit
      # Every service image builds; the gateway and the warehouse service then run on their
      # own network against the warehouse just built, mounted read-only from another path:
      # proves discovery over HTTP, the relocatable warehouse, and the dashboard.
      - name: Build the service images
        run: |
          for target in gateway warehouse retrieval models; do
            docker build --target "$target" -t "fourthdown-$target" .
          done
      - name: Run the gateway and the warehouse service
        run: |
          docker network create fourthdown
          docker run -d --name warehouse --network fourthdown             -v "$PWD/data:/data:ro" fourthdown-warehouse
          docker run -d --name gateway --network fourthdown -p 8000:8000             -e FOURTHDOWN_SERVICES=http://warehouse:8001 fourthdown-gateway
      - name: Smoke test through the gateway
        run: |
          for _ in $(seq 30); do
            curl -sf localhost:8000/api/health | grep -q '"warehouse": *true' && break
            sleep 2
          done
          curl -sf localhost:8000/api/health | grep -q '"warehouse": *true'
          curl -sf "localhost:8000/api/tendencies?season=2024" | grep -q '"rows": *\[\['
          curl -sf localhost:8000/api/ask -H 'Content-Type: application/json'             -d '{"question": "how pass-heavy were the Chiefs in 2024"}' | grep -q '"tool": *"tendency"'
          curl -sf localhost:8000/ | grep -q '<div id="root">'
      - if: failure()
        run: docker logs warehouse; docker logs gateway
