[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fourthdown"
version = "0.1.0"
description = "Hybrid retrieval-augmented analytics over NFL play-by-play data"
readme = "README.md"
requires-python = ">=3.10"
# The base install is the gateway: routing and HTTP only. Each service adds its extra,
# so each image carries only its own heavy dependencies (see fourthdown.services).
dependencies = [
    "requests>=2.31",
    "flask>=3.0",
    "waitress>=3.0",
]

[project.optional-dependencies]
warehouse = ["duckdb>=1.0", "sqlglot>=30,<31"]
retrieval = ["psycopg[binary]>=3.1"]
models = [
    "torch>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "duckdb>=1.0",
    "polars>=1.0",
    "pyarrow>=15.0",
]
# The `fourthdown` CLI: ingest, ETL, indexing, training, evaluation.
pipeline = ["fourthdown[warehouse,retrieval,models]", "typer>=0.12"]
dev = [
    "fourthdown[pipeline]",
    "pytest>=8.0",
    "ruff>=0.16,<0.17",
    "mypy>=1.10",
    "types-requests",
    "types-waitress",
]

[project.scripts]
fourthdown = "fourthdown.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fourthdown = [
    "evaluation/golden.json",
    "evaluation/golden_retrieval.json",
    "evaluation/golden_routing.json",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: requires the full processed dataset on disk",
    "postgres: requires a pgvector Postgres at FOURTHDOWN_PG_DSN",
]

[tool.mypy]
python_version = "3.10"
packages = ["fourthdown"]
mypy_path = "src"
ignore_missing_imports = true
