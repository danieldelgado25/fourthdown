[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fourthdown"
version = "0.1.0"
description = "Hybrid retrieval-augmented analytics over NFL play-by-play data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "polars>=1.0",
    "duckdb>=1.0",
    "pyarrow>=15.0",
    "requests>=2.31",
    "typer>=0.12",
    "sqlglot>=30,<31",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.16,<0.17",
    "mypy>=1.10",
    "types-requests",
]

[project.scripts]
fourthdown = "fourthdown.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fourthdown = ["evaluation/golden.json", "evaluation/golden_retrieval.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: requires the full processed dataset on disk",
    "postgres: requires a pgvector Postgres at FOURTHDOWN_PG_DSN",
]

[tool.mypy]
python_version = "3.10"
packages = ["fourthdown"]
mypy_path = "src"
ignore_missing_imports = true
