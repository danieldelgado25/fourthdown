{{- /* Credentials: the Postgres password, the DSN built from it, and the LLM API key. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fourthdown.secret" . }}
  labels:
    {{- include "fourthdown.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.postgres.enabled }}
  {{- $password := required "postgres.password is required (--set postgres.password=...)" .Values.postgres.password }}
  password: {{ $password | quote }}
  dsn: {{ printf "postgresql://%s:%s@%s-postgres:5432/%s" .Values.postgres.user ($password | urlquery) (include "fourthdown.fullname" .) .Values.postgres.database | quote }}
  {{- else }}
  dsn: {{ required "postgres.externalDsn is required when postgres.enabled=false" .Values.postgres.externalDsn | quote }}
  {{- end }}
  llmApiKey: {{ .Values.llm.apiKey | quote }}
