{{- /* The Postgres password and the DSN built from it; read by Postgres and retrieval. */}}
{{- $name := include "fourthdown.name" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-postgres
  labels:
    {{- include "fourthdown.labels" (dict "root" . "component" "postgres") | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.postgres.enabled }}
  {{- $password := required "postgres.password is required (--set postgres.password=...)" .Values.postgres.password }}
  password: {{ $password | quote }}
  dsn: {{ printf "postgresql://fourthdown:%s@%s-postgres:5432/fourthdown" ($password | urlquery) $name | quote }}
  {{- else }}
  dsn: {{ required "postgres.externalDsn is required when postgres.enabled=false" .Values.postgres.externalDsn | quote }}
  {{- end }}
