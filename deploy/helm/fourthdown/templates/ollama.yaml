{{- if .Values.ollama.enabled }}
{{- $name := printf "%s-ollama" (include "fourthdown.fullname" .) -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "fourthdown.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "fourthdown.selector" (dict "root" . "component" "ollama") | nindent 4 }}
  ports:
    - name: http
      port: 11434
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "fourthdown.labels" . | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "fourthdown.selector" (dict "root" . "component" "ollama") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fourthdown.labels" . | nindent 8 }}
        {{- include "fourthdown.selector" (dict "root" . "component" "ollama") | nindent 8 }}
    spec:
      containers:
        - name: ollama
          image: {{ include "fourthdown.image" .Values.images.ollama }}
          imagePullPolicy: {{ .Values.images.ollama.pullPolicy }}
          ports:
            - name: http
              containerPort: 11434
          readinessProbe:
            httpGet: {path: /api/tags, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /api/tags, port: http}
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.ollama.resources | nindent 12 }}
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
  volumeClaimTemplates:
    - metadata:
        name: models
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.ollama.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.ollama.storage }}
---
{{- $models := printf "%s %s" .Values.llm.model .Values.llm.embedModel }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-pull-%s" $name ($models | sha256sum | trunc 8) }}
  labels:
    {{- include "fourthdown.labels" . | nindent 4 }}
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "fourthdown.selector" (dict "root" . "component" "ollama-pull") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: pull
          image: {{ include "fourthdown.image" .Values.images.ollama }}
          imagePullPolicy: {{ .Values.images.ollama.pullPolicy }}
          env:
            - name: OLLAMA_HOST
              value: {{ include "fourthdown.ollamaUrl" . | quote }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              until ollama list > /dev/null 2>&1; do sleep 2; done
              for model in {{ $models }}; do ollama pull "$model"; done
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 500m, memory: 256Mi}
{{- end }}
