services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: fourthdown
      POSTGRES_PASSWORD: fourthdown
      POSTGRES_DB: fourthdown
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fourthdown"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
