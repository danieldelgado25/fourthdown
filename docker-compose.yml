# `docker compose up -d` starts Postgres alone, for local development.
# `docker compose --profile app up -d --build` (or `make up`) runs every service; the
# dashboard is on http://localhost:8000. Services start in any order and heal as their
# dependencies (Postgres, Ollama models, trained artifacts) appear.
# Data lives in ./data: build and train on the host (`make build train`), or in containers
# with `make pipeline` (the `pipeline` profile: the Dagster asset graph, run once).
# `make dagster-up` (the `dagster` profile) serves the Dagster UI on http://localhost:3000
# and runs the daemon: the weekly schedule and the sensor that retrains when a week lands.
# Start it after the one-shot pipeline has finished, not alongside it.
# The chat model is any OpenAI-compatible endpoint (see fourthdown.llm.client): the bundled
# Ollama by default, or a GPU server / hosted API by setting these three in .env. Narrative
# embeddings always come from Ollama, so they match the index.
x-ollama: &ollama
  OLLAMA_HOST: http://ollama:11434
  FOURTHDOWN_LLM_BASE_URL: ${FOURTHDOWN_LLM_BASE_URL:-http://ollama:11434/v1}
  FOURTHDOWN_LLM_MODEL: ${FOURTHDOWN_LLM_MODEL:-qwen2.5-coder:7b}
  FOURTHDOWN_LLM_API_KEY: ${FOURTHDOWN_LLM_API_KEY:-}
  FOURTHDOWN_EMBED_MODEL: ${FOURTHDOWN_EMBED_MODEL:-nomic-embed-text}
  # Generous for the bundled CPU model (~10 tok/s reading a ~2k-token SQL prompt); lower
  # both when pointing at a GPU or hosted endpoint (.env.example has values for one).
  # The gateway allows 3 completions.
  FOURTHDOWN_LLM_TIMEOUT: ${FOURTHDOWN_LLM_TIMEOUT:-300}
  FOURTHDOWN_TOOL_TIMEOUT: ${FOURTHDOWN_TOOL_TIMEOUT:-960}

# Snowflake (phase 11), for the Dagster daemon's publish_snowflake sensor; off when unset.
# The key goes in as PEM text, so no key file has to exist to start the stack.
x-snowflake: &snowflake
  SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT:-}
  SNOWFLAKE_USER: ${SNOWFLAKE_USER:-}
  SNOWFLAKE_PRIVATE_KEY: ${SNOWFLAKE_PRIVATE_KEY:-}
  SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${SNOWFLAKE_PRIVATE_KEY_PASSPHRASE:-}
  SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE:-FOURTHDOWN}
  SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE:-FOURTHDOWN_WH}
  SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE:-FOURTHDOWN}

x-dsn: &dsn postgresql://fourthdown:${POSTGRES_PASSWORD}@postgres:5432/fourthdown

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: fourthdown
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: fourthdown
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fourthdown"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.35.1}
    profiles: [app, pipeline]
    environment:
      OLLAMA_CONTEXT_LENGTH: 8192   # the schema card plus repair history fits
    ports:
      - "127.0.0.1:11434:11434"   # so the host CLI can index and evaluate against it
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: pulls the embedding model into the ollama volume, and the chat model too
  # unless chat goes to another endpoint (a hosted model id is not pullable), then exits.
  ollama-pull:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.35.1}
    profiles: [app, pipeline]
    environment: *ollama
    entrypoint:
      - sh
      - -c
      - >-
        case "$$FOURTHDOWN_LLM_BASE_URL" in
        http://ollama:11434*) ollama pull "$$FOURTHDOWN_LLM_MODEL" || exit 1 ;;
        esac;
        ollama pull "$$FOURTHDOWN_EMBED_MODEL"
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  # One-shot, as root: hand ./data to the uid every image runs as. On a Linux host the
  # bind mount keeps the host's owner (root, when Docker created the directory), which
  # uid 10001 cannot write; Docker Desktop maps ownership and this is a no-op there.
  data-owner:
    build: { context: ., target: pipeline }
    profiles: [pipeline]
    user: "0"
    command: ["sh", "-c", "[ \"$$(stat -c %u /data)\" = 10001 ] || chown -R 10001:10001 /data"]
    volumes:
      - ./data:/data
    restart: "no"

  # One-shot: `fourthdown pipeline`, the Dagster asset graph run once. Downloads every
  # completed week of FOURTHDOWN_SEASONS not processed yet, builds the warehouse with dbt,
  # embeds the narratives not indexed yet into Postgres, and retrains unless the data and
  # FOURTHDOWN_TRAIN_ARGS are what the last run used. A rerun with nothing new is cheap.
  pipeline:
    build: { context: ., target: pipeline }
    profiles: [pipeline]
    environment:
      <<: *ollama
      FOURTHDOWN_PG_DSN: *dsn
      FOURTHDOWN_SEASONS: ${FOURTHDOWN_SEASONS:-2009-}
      FOURTHDOWN_TRAIN_ARGS: ${FOURTHDOWN_TRAIN_ARGS:-}
      FOURTHDOWN_ALERT_WEBHOOK: ${FOURTHDOWN_ALERT_WEBHOOK:-}
    command:
      - sh
      - -c
      - >-
        exec fourthdown pipeline --seasons "$${FOURTHDOWN_SEASONS}" $${FOURTHDOWN_TRAIN_ARGS}
    volumes:
      - ./data:/data
    depends_on:
      data-owner:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    restart: "no"

  # The Dagster UI (http://localhost:3000): the asset graph, every run's logs, the dbt
  # tests as asset checks, and buttons to materialize a week or rerun publish.
  dagster-webserver:
    build: { context: ., target: pipeline }
    profiles: [dagster]
    environment: &dagster
      <<: [*ollama, *snowflake]
      FOURTHDOWN_PG_DSN: *dsn
      # Where failed runs and stale data are reported (fourthdown.quality.alerts).
      FOURTHDOWN_ALERT_WEBHOOK: ${FOURTHDOWN_ALERT_WEBHOOK:-}
    command: ["dagster-webserver", "-h", "0.0.0.0", "-p", "3000", "-m", "fourthdown.orchestration"]
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy

  # The daemon: the Tuesday schedule that ingests each new week, the sensor that then
  # publishes (dbt, index, retrain, scorecard), and the queue that runs one at a time.
  dagster-daemon:
    build: { context: ., target: pipeline }
    profiles: [dagster]
    environment: *dagster
    command: ["dagster-daemon", "run", "-m", "fourthdown.orchestration"]
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy

  # Phase 12: a game replayed through Redpanda into a live win-probability feed.
  #   docker compose --profile streaming up -d redpanda stream-scorer
  #   docker compose --profile streaming run --rm stream-replay     # GAME=..., SPEED=...
  #   fourthdown stream watch                                      # on the host
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.1
    profiles: [streaming]
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "127.0.0.1:19092:19092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--exit-when-healthy"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Consumes nfl.plays, publishes nfl.win_probability; offsets commit after delivery.
  stream-scorer:
    build: { context: ., target: pipeline }
    profiles: [streaming]
    environment:
      FOURTHDOWN_KAFKA_BOOTSTRAP: redpanda:9092
    command: ["fourthdown", "stream", "score"]
    volumes:
      - ./data:/data:ro
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  # One-shot: publish a game's plays, paced by the game clock (60: a minute per hour).
  stream-replay:
    build: { context: ., target: pipeline }
    profiles: [streaming]
    environment:
      FOURTHDOWN_KAFKA_BOOTSTRAP: redpanda:9092
      GAME: ${GAME:-2023_22_SF_KC}
      SPEED: ${SPEED:-60}
    command: ["sh", "-c", "exec fourthdown stream replay \"$${GAME}\" --speed \"$${SPEED}\""]
    volumes:
      - ./data:/data:ro
    depends_on:
      redpanda:
        condition: service_healthy
    restart: "no"

  warehouse:
    build: { context: ., target: warehouse }
    profiles: [app]
    environment: *ollama
    volumes:
      - ./data:/data:ro
      # The miss log (fourthdown.feedback), made by the pipeline; the only writable path.
      - ./data/feedback:/data/feedback

  retrieval:
    build: { context: ., target: retrieval }
    profiles: [app]
    environment:
      <<: *ollama
      FOURTHDOWN_PG_DSN: *dsn
    depends_on:
      postgres:
        condition: service_healthy

  models:
    build: { context: ., target: models }
    profiles: [app]
    volumes:
      - ./data:/data:ro

  gateway:
    build: { context: ., target: gateway }
    profiles: [app]
    environment:
      <<: *ollama
      FOURTHDOWN_SERVICES: http://warehouse:8001,http://retrieval:8002,http://models:8003
    ports:
      - "8000:8000"
    volumes:
      # The query log (fourthdown.feedback); the gateway reads no other data.
      - ./data/feedback:/data/feedback

  # The provenance-checked win-probability image (`make wp-image` after training).
  winprob:
    image: fourthdown-winprob:latest
    profiles: [winprob]
    ports:
      - "8080:8080"

volumes:
  pgdata:
  ollama:
